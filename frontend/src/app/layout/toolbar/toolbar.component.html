<mat-toolbar
  class="app-toolbar"
  role="banner">

  <div class="toolbar-left">

    <!-- Mobile sidebar button -->
    <button
      *ngIf="isMobile"
      mat-icon-button
      class="sidenav-button"
      (click)="toggleSidenav()"
      [attr.aria-label]="'toolbar.navigation' | translate">

      <mat-icon>menu</mat-icon>

    </button>

    <img
      src="assets/logo-icon.png"
      [attr.alt]="'toolbar.title' | translate"
      class="logo">

  </div>

  <span class="spacer"></span>

  <!-- User menu -->
  <button
    mat-icon-button
    class="menu-button"
    [matMenuTriggerFor]="menu"
    [attr.aria-label]="'toolbar.menu' | translate">

    <mat-icon>account_circle</mat-icon>

  </button>

</mat-toolbar>


<!-- ==========================================================
     User Menu
========================================================== -->

<mat-menu
  #menu="matMenu"
  class="user-menu"
  panelClass="user-menu-panel">

  <div class="menu-header">

    <div class="menu-avatar">
      {{ userName().charAt(0) | uppercase }}
    </div>

    <div class="menu-user">

      <div class="menu-user-name">
        {{ userName() }}
      </div>

      <div class="menu-user-email">
        {{ userEmail() }}
      </div>

    </div>

  </div>

  <mat-divider></mat-divider>


  <!-- Profile -->

  <button
    mat-menu-item
    (click)="userDetails()">

    <mat-icon>person</mat-icon>

    <span>
      {{ 'toolbar.profile' | translate }}
    </span>

  </button>


  <!-- Language -->

  <button
    mat-menu-item
    [matMenuTriggerFor]="languageMenu">

    <mat-icon>language</mat-icon>

    <span>
      {{ 'toolbar.language' | translate }}
    </span>

    <span class="menu-spacer"></span>

    <span class="current-language">
      {{ currentLanguageName }}
    </span>

  </button>


  <mat-menu #languageMenu="matMenu">

    <button
      mat-menu-item
      *ngFor="let language of languages"
      (click)="changeLanguage(language.code)">

      <span class="flag">
        {{ language.flag }}
      </span>

      <span>
        {{ language.name }}
      </span>

      <span class="menu-spacer"></span>

      <mat-icon
        *ngIf="currentLanguage === language.code">

        check

      </mat-icon>

    </button>

  </mat-menu>


  <mat-divider></mat-divider>


  <!-- Logout -->

  <button
    mat-menu-item
    class="logout-item"
    (click)="logout()">

    <mat-icon>logout</mat-icon>

    <span>
      {{ 'toolbar.logout' | translate }}
    </span>

  </button>

</mat-menu>
