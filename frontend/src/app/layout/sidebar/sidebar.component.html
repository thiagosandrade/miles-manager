<mat-sidenav-container class="sidenav-container">

  <mat-sidenav
    [opened]="opened"
    [mode]="sidenavMode"
    class="app-sidenav"
    [fixedInViewport]="true">

    <mat-nav-list>

      <ng-container *ngFor="let item of visibleNavigation; let i = index">
        <div
          *ngIf="isAdministrator && item.adminOnly &&
            (i === 0 || !visibleNavigation[i - 1].adminOnly)"
          class="navigation-divider">
        </div>

        <a
          mat-list-item
          [routerLink]="item.path"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="onNavigationClick()">

          <mat-icon matListItemIcon>
            {{ item.icon }}
          </mat-icon>

          <span matListItemTitle>
            {{ item.label | translate }}
          </span>

        </a>
      </ng-container>

    </mat-nav-list>

  </mat-sidenav>

  <mat-sidenav-content>
    <ng-content></ng-content>
  </mat-sidenav-content>

</mat-sidenav-container>
