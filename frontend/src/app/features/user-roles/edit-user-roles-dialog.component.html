<h2 mat-dialog-title>

  <div class="dialog-header">

    <div class="dialog-icon">

      <mat-icon>admin_panel_settings</mat-icon>

    </div>

    <div>

      <h2>

        {{ 'userRoles.dialog.title' | translate }}

      </h2>

      <p>

        {{ 'userRoles.dialog.subtitle' | translate }}

      </p>

    </div>

  </div>

</h2>

<mat-dialog-content>

  <div class="roles-container">

    <mat-checkbox
      *ngFor="let role of allRoles()"
      [checked]="isSelected(role.roleId)"
      (change)="toggleRole(role.roleId, $event.checked)">

      {{ role.name }}

    </mat-checkbox>

  </div>

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button
    mat-stroked-button
    type="button"
    (click)="cancel()">

    {{ 'common.cancel' | translate }}

  </button>

  <button
    mat-flat-button
    color="primary"
    type="button"
    (click)="save()"
    [disabled]="loading()">

    <mat-icon>check</mat-icon>

    {{ 'common.save' | translate }}

  </button>

</mat-dialog-actions>
