<div class="reset-password-page">
  <mat-card class="reset-password-card">
    <div class="reset-password-header">
      <img
        src="assets/logo-icon.png"
        alt="Miles Manager"
        class="logo">

      <h1>Reset your password</h1>
      <p *ngIf="loading()">Validating your reset link...</p>
      <p *ngIf="!loading() && validToken()">Choose a new password for your account.</p>
      <p *ngIf="!loading() && !validToken()" class="error-message">
        This password reset link is invalid or has expired.
      </p>
    </div>

    <form
      *ngIf="!loading() && validToken()"
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="reset-password-form">

      <app-input
        formControlName="email"
        type="email"
        label="Email"
        icon="mail"
        [readonly]="true">
      </app-input>

      <app-input
        formControlName="newPassword"
        type="password"
        label="New password"
        placeholder="New password"
        icon="lock"
        [errors]="{
          required: 'Password is required.',
          minlength: 'Password must be at least 8 characters.'
        }">
      </app-input>

      <app-input
        formControlName="confirmPassword"
        type="password"
        label="Confirm new password"
        placeholder="Confirm new password"
        icon="lock"
        [errors]="{
          required: 'Password confirmation is required.'
        }">
      </app-input>

      <p *ngIf="form.hasError('passwordsMismatch') && form.get('confirmPassword')?.touched" class="validation-message">
        Passwords do not match.
      </p>

      <button
        class="reset-password-button"
        type="submit"
        [disabled]="saving() || form.invalid">
        {{ saving() ? 'Updating...' : 'Update password' }}
      </button>
    </form>

    <div class="login-link">
      <button type="button" (click)="goToLogin()">Back to Sign In</button>
    </div>
  </mat-card>
</div>
