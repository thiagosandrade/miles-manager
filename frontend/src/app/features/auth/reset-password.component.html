<div class="reset-password-page">
  <mat-card class="reset-password-card">
    <div class="reset-password-header">
      <img
        src="assets/logo-icon.png"
        [attr.alt]="'auth.logoAlt' | translate"
        class="logo">

      <h1>{{ 'resetPassword.title' | translate }}</h1>
      <p *ngIf="loading()">{{ 'resetPassword.validating' | translate }}</p>
      <p *ngIf="!loading() && validToken()">{{ 'resetPassword.subtitle' | translate }}</p>
      <p *ngIf="!loading() && !validToken()" class="error-message">
        {{ 'resetPassword.invalidLink' | translate }}
      </p>
    </div>

    <form
      *ngIf="!loading() && validToken()"
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="reset-password-form">

      <app-input
        formControlName="email"
        type="email"
        [label]="'auth.email' | translate"
        icon="mail"
        [readonly]="true">
      </app-input>

      <app-input
        formControlName="newPassword"
        type="password"
        [label]="'resetPassword.newPassword' | translate"
        [placeholder]="'resetPassword.newPassword' | translate"
        icon="lock"
        [errors]="{
          required: 'resetPassword.passwordRequired',
          minlength: 'resetPassword.passwordMinLength'
        }">
      </app-input>

      <app-input
        formControlName="confirmPassword"
        type="password"
        [label]="'resetPassword.confirmPassword' | translate"
        [placeholder]="'resetPassword.confirmPassword' | translate"
        icon="lock"
        [errors]="{
          required: 'resetPassword.passwordConfirmationRequired'
        }">
      </app-input>

      <p *ngIf="form.hasError('passwordsMismatch') && form.get('confirmPassword')?.touched" class="validation-message">
        {{ 'resetPassword.passwordsMismatch' | translate }}
      </p>

      <button
        class="reset-password-button"
        type="submit"
        [disabled]="saving() || form.invalid">
        {{ saving() ? ('resetPassword.updating' | translate) : ('resetPassword.updatePassword' | translate) }}
      </button>
    </form>

    <div class="login-link">
      <button type="button" (click)="goToLogin()">{{ 'resetPassword.backToSignIn' | translate }}</button>
    </div>
  </mat-card>
</div>
