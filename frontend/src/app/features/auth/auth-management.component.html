<div class="login-page">

  <mat-card class="login-card">

    <div class="login-header">
      <img
        src="assets/logo-icon.png"
        alt="Miles Manager"
        class="logo">

      <h1>{{ 'auth.welcome' | translate }}</h1>

      <p>{{ 'auth.top-definition' | translate }}</p>
    </div>

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="login-form">

      <app-text-input
        formControlName="email"
        type="email"
        [label]="'auth.email' | translate"
        placeholder="john.doe@email.com"
        icon="mail"
        [errorMessage]="form.controls.email.hasError('required')
          ? ('auth.email-required' | translate)
          : ('auth.email-invalid' | translate)">
      </app-text-input>

      <app-text-input
        formControlName="password"
        type="password"
        [label]="'auth.password' | translate"
        placeholder="Password"
        icon="lock"
        [errorMessage]="'auth.password-required' | translate">
      </app-text-input>

      <button
        class="login-button"
        type="submit"
        [disabled]="loading || form.invalid">

        <span *ngIf="!loading">
          {{ 'auth.signin' | translate }}
        </span>

        <span *ngIf="loading">
          {{ 'auth.logging' | translate }}
        </span>

      </button>

    </form>

    <div class="login-footer">
      {{ 'auth.footer' | translate }}
      <span>•</span>
      {{ 'auth.version' | translate }}
    </div>

  </mat-card>

</div>
