<div class="login-page">

  <mat-card class="login-card">

    <div class="login-header">
      <img
        src="assets/logo-icon.png"
        [attr.alt]="'auth.logoAlt' | translate"
        class="logo">

      <h1>{{ 'auth.welcome' | translate }}</h1>

      <p>{{ 'auth.top-definition' | translate }}</p>
    </div>

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="login-form">

      <app-input
        formControlName="email"
        type="email"
        [label]="'auth.email' | translate"
        [placeholder]="'auth.emailPlaceholder' | translate"
        icon="mail"
        [errors]="{
          required: 'auth.emailRequired',
          email: 'auth.emailInvalid'
        }">
      </app-input>

      <app-input
        formControlName="password"
        type="password"
        [label]="'auth.password' | translate"
        [placeholder]="'auth.passwordPlaceholder' | translate"
        icon="lock"
        [errors]="{
          required: 'auth.passwordRequired'
        }">
      </app-input>

      <button
        class="login-button"
        type="submit"
        [disabled]="loading || form.invalid">

        <span *ngIf="!loading">
          {{ 'auth.signin' | translate }}
        </span>

        <span *ngIf="loading">
          {{ 'auth.logging' | translate }}
        </span>

      </button>

    </form>

    <div class="signup-link">
      {{ 'auth.noAccount' | translate }}
      <button type="button" (click)="goToSignUp()">{{ 'auth.signup' | translate }}</button>
    </div>

    <div class="login-footer">
      {{ 'auth.footer' | translate }}
      <span>•</span>
      {{ 'auth.version' | translate }}
    </div>

  </mat-card>

</div>
