<div class="forgot-password-page">
  <mat-card class="forgot-password-card">
    <div class="forgot-password-header">
      <img
        src="assets/logo-icon.png"
        [attr.alt]="'auth.logoAlt' | translate"
        class="logo">

      <h1>{{ 'forgotPassword.title' | translate }}</h1>
      <p>{{ 'forgotPassword.subtitle' | translate }}</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="forgot-password-form">
      <app-input
        formControlName="email"
        type="email"
        [label]="'auth.email' | translate"
        [placeholder]="'auth.emailPlaceholder' | translate"
        icon="mail"
        [errors]="{
          required: 'auth.emailRequired',
          email: 'auth.emailInvalid'
        }">
      </app-input>

      <button
        class="forgot-password-button"
        type="submit"
        [disabled]="loading || form.invalid">
        {{ loading ? ('forgotPassword.sending' | translate) : ('forgotPassword.sendResetLink' | translate) }}
      </button>
    </form>

    <div class="login-link">
      {{ 'forgotPassword.rememberPassword' | translate }}
      <button type="button" (click)="goToLogin()">{{ 'auth.signin' | translate }}</button>
    </div>
  </mat-card>
</div>
