<h2 mat-dialog-title>
  {{
    data.operation === 'create'
      ? ('programs.dialog.createTitle' | translate)
      : ('programs.dialog.updateTitle' | translate)
  }}
</h2>

<form
  [formGroup]="form"
  (ngSubmit)="save()">

  <mat-dialog-content>

    <app-text-input
      formControlName="programCode"
      [label]="'programs.dialog.programCode' | translate">
    </app-text-input>

    <app-text-input
      formControlName="name"
      [label]="'programs.dialog.name' | translate">
    </app-text-input>

    <app-select
      formControlName="programType"
      [label]="'programs.dialog.programType' | translate"
      [options]="programTypeOptions">
    </app-select>

    <app-text-input
      formControlName="website"
      [label]="'programs.dialog.website' | translate">
    </app-text-input>

    <app-text-input
      formControlName="logo"
      [label]="'programs.dialog.logoUrl' | translate">
    </app-text-input>

    <app-number-input
      formControlName="referencePricePerThousand"
      [label]="'programs.dialog.referencePrice' | translate"
      [min]="0">
    </app-number-input>

    <app-select
      formControlName="currencyCode"
      [label]="'programs.dialog.currencyCode' | translate"
      [options]="currencyOptions">
    </app-select>

    <app-checkbox
      formControlName="isActive"
      [label]="'programs.dialog.active' | translate">
    </app-checkbox>

  </mat-dialog-content>

  <mat-dialog-actions align="end">

    <button
      mat-button
      type="button"
      (click)="close()">
      {{ 'common.cancel' | translate }}
    </button>

    <button
      mat-flat-button
      color="primary"
      type="submit"
      [disabled]="form.invalid || loading">
      {{
        data.operation === 'create'
          ? ('common.create' | translate)
          : ('common.update' | translate)
      }}
    </button>

  </mat-dialog-actions>

</form>
