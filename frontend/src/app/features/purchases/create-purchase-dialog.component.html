<h2 mat-dialog-title>

  {{
    data.operation === 'create'
      ? ('purchases.dialog.createTitle' | translate)
      : data.operation === 'clone'
        ? 'Clone Purchase'
        : ('purchases.dialog.updateTitle' | translate)
  }}

</h2>

<mat-dialog-content>

  <form
    class="dialog-form"
    [formGroup]="form">

    <app-select
      formControlName="programId"
      [label]="'purchases.dialog.program' | translate"
      [options]="programs.map(p => ({ value: p.id, viewValue: p.name }))">
    </app-select>

    <app-text-input
      formControlName="partner"
      [label]="'purchases.dialog.partner' | translate">
    </app-text-input>

    <mat-form-field appearance="outline">

      <mat-label>
        {{ 'purchases.dialog.description' | translate }}
      </mat-label>

      <textarea
        matInput
        rows="3"
        formControlName="description">
      </textarea>

    </mat-form-field>

    <app-money-input
      formControlName="amountPaid"
      [label]="'purchases.dialog.amountPaid' | translate"
      [currency]="getSelectedCurrencyCode()">
    </app-money-input>

    <app-number-input
      formControlName="milesPurchased"
      [label]="'purchases.dialog.milesPurchased' | translate"
      [min]="1">
    </app-number-input>

    <app-select
      formControlName="purchaseStatus"
      [label]="'purchases.dialog.purchaseStatus' | translate"
      [options]="purchaseStatuses.map(status => ({ value: status.value, viewValue: ('common.' + status.label.toLowerCase()) | translate }))">
    </app-select>

    <app-date-input
      formControlName="purchaseDate"
      [label]="'purchases.dialog.purchaseDate' | translate">
    </app-date-input>

  </form>

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button
    mat-button
    type="button"
    (click)="cancel()">

    {{ 'common.cancel' | translate }}

  </button>

  <button
    mat-flat-button
    color="primary"
    type="button"
    (click)="save()"
    [disabled]="form.invalid">

    {{
      data.operation === 'create'
        ? ('purchases.dialog.createButton' | translate)
        : data.operation === 'clone'
          ? 'Clone Purchase'
          : ('purchases.dialog.updateButton' | translate)
    }}

  </button>

</mat-dialog-actions>
