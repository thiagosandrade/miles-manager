<h2 mat-dialog-title>

  New Purchase

</h2>

<mat-dialog-content>

  <form
    class="dialog-form"
    [formGroup]="form">

    <!-- Program -->

    <mat-form-field appearance="outline">

      <mat-label>Program</mat-label>

      <mat-select formControlName="programId">

        <mat-option
          *ngFor="let program of programs"
          [value]="program.id">

          {{ program.name }}

        </mat-option>

      </mat-select>

    </mat-form-field>

    <!-- Partner -->

    <mat-form-field appearance="outline">

      <mat-label>Partner</mat-label>

      <input
        matInput
        formControlName="partner">

    </mat-form-field>

    <!-- Description -->

    <mat-form-field appearance="outline">

      <mat-label>Description</mat-label>

      <textarea
        matInput
        rows="3"
        formControlName="description">
      </textarea>

    </mat-form-field>

    <!-- Amount Paid -->

    <mat-form-field appearance="outline">

      <mat-label>Amount Paid</mat-label>

      <input
        matInput
        type="number"
        formControlName="amountPaid">

    </mat-form-field>

    <!-- Miles Purchased -->

    <mat-form-field appearance="outline">

      <mat-label>Miles Purchased</mat-label>

      <input
        matInput
        type="number"
        formControlName="milesPurchased">

    </mat-form-field>

    <!-- Bonus Percentage -->

    <mat-form-field appearance="outline">

      <mat-label>Bonus Percentage</mat-label>

      <input
        matInput
        type="number"
        formControlName="bonusPercentage">

    </mat-form-field>

    <!-- Purchase Status -->

    <mat-form-field appearance="outline">

      <mat-label>Purchase Status</mat-label>

      <mat-select formControlName="purchaseStatus">

        <mat-option
          *ngFor="let status of purchaseStatuses"
          [value]="status.value">

          {{ status.label }}

        </mat-option>

      </mat-select>

    </mat-form-field>

    <!-- Purchase Date -->

    <mat-form-field appearance="outline">

      <mat-label>Purchase Date</mat-label>

      <input
        matInput
        [matDatepicker]="picker"
        formControlName="purchaseDate">

      <mat-datepicker-toggle
        matIconSuffix
        [for]="picker">
      </mat-datepicker-toggle>

      <mat-datepicker #picker></mat-datepicker>

    </mat-form-field>

  </form>

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button
    mat-button
    type="button"
    (click)="cancel()">

    Cancel

  </button>

  <button
    mat-flat-button
    color="primary"
    type="button"
    (click)="save()"
    [disabled]="form.invalid">

    Create Purchase

  </button>

</mat-dialog-actions>
