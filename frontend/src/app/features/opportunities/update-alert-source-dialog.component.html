<h2 mat-dialog-title>Update alert source</h2>

<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content>
    <mat-form-field appearance="outline">
      <mat-label>Title</mat-label>
      <input matInput formControlName="title">
      <mat-error *ngIf="form.controls.title.hasError('required')">Title is required.</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>External URL</mat-label>
      <input matInput formControlName="externalUrl" type="url">
      <mat-error *ngIf="form.controls.externalUrl.hasError('required')">External URL is required.</mat-error>
      <mat-error *ngIf="form.controls.externalUrl.hasError('pattern')">Enter a valid absolute URL.</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Country</mat-label>
      <input matInput formControlName="country">
      <mat-error *ngIf="form.controls.country.hasError('required')">Country is required.</mat-error>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" [disabled]="saving" (click)="close()">
      Cancel
    </button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || saving">
      <mat-icon>save</mat-icon>
      Update
    </button>
  </mat-dialog-actions>
</form>
