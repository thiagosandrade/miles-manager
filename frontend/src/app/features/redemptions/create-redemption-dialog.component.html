<h2 mat-dialog-title>
  {{
    data.operation === 'create'
      ? ('redemptions.dialog.createTitle' | translate)
      : ('redemptions.dialog.updateTitle' | translate)
  }}
</h2>

<mat-dialog-content>

  <form
    class="dialog-form"
    [formGroup]="form">

    <app-select
      formControlName="programId"
      [label]="'redemptions.dialog.program' | translate"
      [options]="programs.map(p => ({ value: p.id, viewValue: p.name }))">
    </app-select>

    <app-select
      formControlName="originAirportCode"
      [label]="'redemptions.dialog.originAirport' | translate"
      [options]="airports.map(a => ({ value: a.iataCode, viewValue: a.name + ' (' + a.iataCode + ')' }))">
    </app-select>

    <app-select
      formControlName="destinationAirportCode"
      [label]="'redemptions.dialog.destinationAirport' | translate"
      [options]="airports.map(a => ({ value: a.iataCode, viewValue: a.name + ' (' + a.iataCode + ')' }))">
    </app-select>

    <app-date-input
      formControlName="flightDate"
      [label]="'redemptions.dialog.flightDate' | translate">
    </app-date-input>

    <app-select
      formControlName="cabinClass"
      [label]="'redemptions.dialog.cabinClass' | translate"
      [options]="[
        { value: 0, viewValue: ('redemptions.cabin.economy' | translate) },
        { value: 1, viewValue: ('redemptions.cabin.premiumEconomy' | translate) },
        { value: 2, viewValue: ('redemptions.cabin.business' | translate) },
        { value: 3, viewValue: ('redemptions.cabin.first' | translate) }
      ]">
    </app-select>

    <app-number-input
      formControlName="passengers"
      [label]="'redemptions.dialog.passengers' | translate"
      [min]="1">
    </app-number-input>

    <app-number-input
      formControlName="milesUsed"
      [label]="'redemptions.dialog.milesUsed' | translate"
      [min]="1">
    </app-number-input>

    <app-money-input
      formControlName="taxes"
      [label]="'redemptions.dialog.taxes' | translate"
      [currency]="'EUR'">
    </app-money-input>

    <app-money-input
      formControlName="cashPrice"
      [label]="'redemptions.dialog.cashPrice' | translate"
      [currency]="'EUR'">
    </app-money-input>

    <app-checkbox
      formControlName="isRoundTrip"
      [label]="'redemptions.dialog.roundTrip' | translate">
    </app-checkbox>

  </form>

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button
    mat-button
    type="button"
    (click)="cancel()">

    {{ 'common.cancel' | translate }}

  </button>

  <button
    mat-flat-button
    color="primary"
    type="button"
    (click)="save()"
    [disabled]="form.invalid">

    {{
      data.operation === 'create'
        ? ('common.create' | translate)
        : ('common.update' | translate)
    }}

  </button>

</mat-dialog-actions>
