<h2 mat-dialog-title>
  {{
    data.operation === 'create'
      ? ('transfers.dialog.createTitle' | translate)
      : ('transfers.dialog.updateTitle' | translate)
  }}
</h2>

<mat-dialog-content>

  <form
    class="dialog-form"
    [formGroup]="form">

    <app-select
      formControlName="originProgramId"
      [label]="'transfers.dialog.originProgram' | translate"
      [options]="programs.map(p => ({ value: p.id, viewValue: p.name }))">
    </app-select>

    <app-select
      formControlName="destinationProgramId"
      [label]="'transfers.dialog.destinationProgram' | translate"
      [options]="programs.map(p => ({ value: p.id, viewValue: p.name }))">
    </app-select>

    <app-number-input
      formControlName="milesSent"
      [label]="'transfers.dialog.milesSent' | translate"
      [min]="1">
    </app-number-input>

    <app-number-input
      formControlName="bonusPercentage"
      [label]="'transfers.dialog.bonusPercentage' | translate"
      [min]="0">
    </app-number-input>

    <app-number-input
      formControlName="milesReceived"
      [label]="'transfers.dialog.milesReceived' | translate"
      [min]="1">
    </app-number-input>

    <app-date-input
      formControlName="transferDate"
      [label]="'transfers.dialog.transferDate' | translate">
    </app-date-input>

    <app-number-input
      formControlName="costPerThousandOrigin"
      [label]="'transfers.dialog.costPerThousandOrigin' | translate"
      [min]="1"
      [step]="0.01">
    </app-number-input>

    <app-number-input
      formControlName="costPerThousandDestination"
      [label]="'transfers.dialog.costPerThousandDestination' | translate"
      [min]="1"
      [step]="0.01">
    </app-number-input>

  </form>

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button
    mat-button
    type="button"
    (click)="cancel()">

    {{ 'common.cancel' | translate }}

  </button>

  <button
    mat-flat-button
    color="primary"
    type="button"
    (click)="save()"
    [disabled]="form.invalid">

    {{
      data.operation === 'create'
        ? ('common.create' | translate)
        : ('common.update' | translate)
    }}

  </button>

</mat-dialog-actions>
