<h2 mat-dialog-title>
  {{
    data.operation === 'create'
      ? ('transfers.dialog.createTitle' | translate)
      : ('transfers.dialog.updateTitle' | translate)
  }}
</h2>

<mat-dialog-content>
  <form class="dialog-form" [formGroup]="form">
    <app-select
      formControlName="originProgramId"
      [label]="'transfers.dialog.originProgram' | translate"
      [options]="originProgramOptions">
    </app-select>

    <app-select
      formControlName="destinationProgramId"
      [label]="'transfers.dialog.destinationProgram' | translate"
      [options]="destinationProgramOptions">
    </app-select>

    <div class="factor-editor" *ngIf="form.controls.originProgramId.value && form.controls.destinationProgramId.value">
      <div class="factor-label">{{ 'transfers.dialog.transferFactor' | translate }}</div>
      <div class="factor-inputs">
        <app-number-input
          formControlName="factorFrom"
          [label]="'transfers.dialog.transferFactor' | translate"
          [min]="0.000001"
          [step]="0.1">
        </app-number-input>
        <span class="factor-separator" aria-hidden="true">:</span>
        <app-number-input
          formControlName="factorTo"
          [label]="'transfers.dialog.transferFactor' | translate"
          [min]="0.000001"
          [step]="0.1">
        </app-number-input>
      </div>
      <div class="factor-preview">
        {{ form.controls.factorFrom.value }} : {{ form.controls.factorTo.value }}
      </div>
    </div>

    <app-number-input
      formControlName="milesSent"
      [label]="'transfers.dialog.milesSent' | translate"
      [min]="1">
    </app-number-input>

    <app-number-input
      formControlName="bonusPercentage"
      [label]="'transfers.dialog.bonusPercentage' | translate"
      [min]="0">
    </app-number-input>

    <app-number-input
      formControlName="milesReceived"
      [label]="'transfers.dialog.milesReceived' | translate"
      [min]="1"
      [readonly]="true">
    </app-number-input>

    <app-date-input
      formControlName="transferDate"
      [label]="'transfers.dialog.transferDate' | translate">
    </app-date-input>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">
    {{ 'common.cancel' | translate }}
  </button>

  <button
    mat-flat-button
    color="primary"
    type="button"
    (click)="save()"
    [disabled]="form.invalid">
    {{
      data.operation === 'create'
        ? ('common.create' | translate)
        : ('common.update' | translate)
    }}
  </button>
</mat-dialog-actions>
