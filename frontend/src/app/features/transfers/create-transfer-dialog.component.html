<h2 mat-dialog-title>
  New Transfer
</h2>

<mat-dialog-content>

  <form
    class="dialog-form"
    [formGroup]="form">

    <!-- Origin -->

    <mat-form-field appearance="outline">

      <mat-label>Origin Program</mat-label>

      <mat-select formControlName="originProgramId">

        <mat-option
          *ngFor="let program of programs"
          [value]="program.id">

          {{ program.name }}

        </mat-option>

      </mat-select>

    </mat-form-field>

    <!-- Destination -->

    <mat-form-field appearance="outline">

      <mat-label>Destination Program</mat-label>

      <mat-select formControlName="destinationProgramId">

        <mat-option
          *ngFor="let program of programs"
          [value]="program.id">

          {{ program.name }}

        </mat-option>

      </mat-select>

    </mat-form-field>

    <!-- Miles Sent -->

    <mat-form-field appearance="outline">

      <mat-label>Miles Sent</mat-label>

      <input
        matInput
        type="number"
        formControlName="milesSent">

    </mat-form-field>

    <!-- Bonus Percentage -->

    <mat-form-field appearance="outline">

      <mat-label>Bonus Percentage</mat-label>

      <input
        matInput
        type="number"
        formControlName="bonusPercentage">

    </mat-form-field>

    <!-- Miles Received -->

    <mat-form-field appearance="outline">

      <mat-label>Miles Received</mat-label>

      <input
        matInput
        type="number"
        formControlName="milesReceived">

    </mat-form-field>

    <!-- Transfer Date -->

    <mat-form-field appearance="outline">

      <mat-label>Transfer Date</mat-label>

      <input
        matInput
        [matDatepicker]="picker"
        formControlName="transferDate">

      <mat-datepicker-toggle
        matSuffix
        [for]="picker">
      </mat-datepicker-toggle>

      <mat-datepicker #picker></mat-datepicker>

    </mat-form-field>

    <!-- Cost Per Thousand Origin -->

    <mat-form-field appearance="outline">

      <mat-label>Cost Per Thousand (Origin)</mat-label>

      <input
        matInput
        type="number"
        formControlName="costPerThousandOrigin">

    </mat-form-field>

    <!-- Cost Per Thousand Destination -->

    <mat-form-field appearance="outline">

      <mat-label>Cost Per Thousand (Destination)</mat-label>

      <input
        matInput
        type="number"
        formControlName="costPerThousandDestination">

    </mat-form-field>

  </form>

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button
    mat-button
    type="button"
    (click)="cancel()">

    Cancel

  </button>

  <button
    mat-flat-button
    color="primary"
    type="button"
    (click)="save()"
    [disabled]="form.invalid">

    Create Transfer

  </button>

</mat-dialog-actions>
