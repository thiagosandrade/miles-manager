<h2 mat-dialog-title>
  {{ (data.operation === 'update'
    ? 'common.update'
    : 'common.create') | translate }}
  {{ 'sidebar.programFactors' | translate }}
</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="form">

    <app-select
      formControlName="originProgramId"
      [label]="('common.origin' | translate) + ' ' + ('common.program' | translate)"
      [options]="programOptions">
    </app-select>

    <app-select
      formControlName="destinationProgramId"
      [label]="('common.destination' | translate) + ' ' + ('common.program' | translate)"
      [options]="programOptions">
    </app-select>

    <div class="factor-inputs">
      <app-number-input
        formControlName="fromAmount"
        [label]="'common.amount' | translate"
        [step]="'any'"
        [min]="0.0001">
      </app-number-input>

      <span class="separator">:</span>

      <app-number-input
        formControlName="toAmount"
        [label]="'common.amount' | translate"
        [step]="'any'"
        [min]="0.0001">
      </app-number-input>
    </div>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()" [disabled]="loading">
    {{ 'common.cancel' | translate }}
  </button>

  <button
    mat-flat-button
    color="primary"
    type="button"
    (click)="save()"
    [disabled]="loading">
    {{ 'common.save' | translate }}
  </button>
</mat-dialog-actions>
