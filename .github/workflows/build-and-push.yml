name: Build and Deploy Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      step:
        description: Which step to run
        required: false
        default: all
        type: choice
        options:
          - all
          - build
          - push
          - deploy

env:
  REGISTRY: us-central1-docker.pkg.dev
  PROJECT_ID: impactful-shard-137923
  REPOSITORY: miles-manager-containers
  VM_APP_DIR: /home/thiagosoares_andrade/miles-manager

jobs:
  build-backend:
    if: github.event_name != 'workflow_dispatch' || inputs.step == 'all' || inputs.step == 'build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: |
          docker build \
            -f backend/src/MilesManager.Api/Dockerfile \
            -t backend:latest \
            ./backend
      - name: Save backend image
        run: docker save backend:latest -o backend-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.tar

  build-frontend:
    if: github.event_name != 'workflow_dispatch' || inputs.step == 'all' || inputs.step == 'build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t frontend:latest \
            ./frontend
      - name: Save frontend image
        run: docker save frontend:latest -o frontend-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: frontend-image.tar

  push-images:
    if: github.event_name != 'workflow_dispatch' || inputs.step == 'all' || inputs.step == 'push'
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-image
      - uses: actions/download-artifact@v4
        with:
          name: frontend-image
      # login + docker load + docker tag + docker push here

  deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.step == 'all' || inputs.step == 'deploy'
    runs-on: ubuntu-latest
    needs: push-images
    steps:
      - name: Deploy to Google VM
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          script: |
            cd ${{ env.VM_APP_DIR }}
            docker compose -f docker-compose.vm.yml pull
            docker compose -f docker-compose.vm.yml up -d
            docker compose -f docker-compose.vm.yml ps