name: Build and Deploy Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: us-central1-docker.pkg.dev
  PROJECT_ID: impactful-shard-137923
  REPOSITORY: miles-manager-containers
  VM_APP_DIR: /home/thiagosoares_andrade/miles-manager

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            -f backend/src/MilesManager.Api/Dockerfile \
            -t backend-image:latest \
            ./backend

      - name: Save backend image
        run: docker save backend-image:latest -o backend-image.tar

      - name: Upload backend image
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.tar

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build frontend image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t frontend-image:latest \
            ./frontend

      - name: Save frontend image
        run: docker save frontend-image:latest -o frontend-image.tar

      - name: Upload frontend image
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: frontend-image.tar

  push-images:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set image names
        id: images
        run: |
          echo "backend=${REGISTRY}/${PROJECT_ID}/${REPOSITORY}/backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${REGISTRY}/${PROJECT_ID}/${REPOSITORY}/frontend" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Download backend image
        uses: actions/download-artifact@v4
        with:
          name: backend-image

      - name: Download frontend image
        uses: actions/download-artifact@v4
        with:
          name: frontend-image

      - name: Load backend image
        run: docker load -i backend-image.tar

      - name: Load frontend image
        run: docker load -i frontend-image.tar

      - name: Tag backend image
        run: |
          docker tag backend-image:latest "${{ steps.images.outputs.backend }}:latest"
          docker tag backend-image:latest "${{ steps.images.outputs.backend }}:${{ steps.images.outputs.sha }}"

      - name: Tag frontend image
        run: |
          docker tag frontend-image:latest "${{ steps.images.outputs.frontend }}:latest"
          docker tag frontend-image:latest "${{ steps.images.outputs.frontend }}:${{ steps.images.outputs.sha }}"

      - name: Push backend image
        run: |
          docker push "${{ steps.images.outputs.backend }}:latest"
          docker push "${{ steps.images.outputs.backend }}:${{ steps.images.outputs.sha }}"

      - name: Push frontend image
        run: |
          docker push "${{ steps.images.outputs.frontend }}:latest"
          docker push "${{ steps.images.outputs.frontend }}:${{ steps.images.outputs.sha }}"

  deploy:
    runs-on: ubuntu-latest
    needs: push-images

    steps:
      - name: Deploy to Google VM
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          script: |
            cd ${{ env.VM_APP_DIR }}
            docker compose -f docker-compose.vm.yml pull
            docker compose -f docker-compose.vm.yml up -d --force-recreate --remove-orphans
            docker compose -f docker-compose.vm.yml ps