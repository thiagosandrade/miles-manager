name: Build and Deploy Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: us-central1-docker.pkg.dev
  PROJECT_ID: impactful-shard-137923
  REPOSITORY: miles-manager-containers
  VM_APP_DIR: /home/thiagosoares_andrade/miles-manager

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set image names
        id: images
        run: |
          echo "backend=${REGISTRY}/${PROJECT_ID}/${REPOSITORY}/backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${REGISTRY}/${PROJECT_ID}/${REPOSITORY}/frontend" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: |
          docker build \
            -f backend/src/MilesManager.Api/Dockerfile \
            -t "${{ steps.images.outputs.backend }}:latest" \
            -t "${{ steps.images.outputs.backend }}:${{ steps.images.outputs.sha }}" \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t "${{ steps.images.outputs.frontend }}:latest" \
            -t "${{ steps.images.outputs.frontend }}:${{ steps.images.outputs.sha }}" \
            ./frontend

      - name: Push backend image
        run: |
          docker push "${{ steps.images.outputs.backend }}:latest"
          docker push "${{ steps.images.outputs.backend }}:${{ steps.images.outputs.sha }}"

      - name: Push frontend image
        run: |
          docker push "${{ steps.images.outputs.frontend }}:latest"
          docker push "${{ steps.images.outputs.frontend }}:${{ steps.images.outputs.sha }}"

      - name: Deploy to Google VM
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          script_stop: true
          script: |
            cd ${{ env.VM_APP_DIR }}
            docker compose -f docker-compose-vm.yml pull
            docker compose -f docker-compose-vm.yml up -d
            docker compose -f docker-compose-vm.yml ps
