name: Cleanup Old Workflow Runs

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview deletions without deleting anything"
        required: true
        default: true
        type: boolean

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Keep Latest Successful Run
    runs-on: ubuntu-latest

    steps:
      - name: Preview or delete workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CLEANUP_WORKFLOW_ID: ${{ github.workflow }} 
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository: $REPOSITORY"
          echo "Dry run: $DRY_RUN"
          echo "Current cleanup run: $CURRENT_RUN_ID"

          RUNS="$(gh api \
            --paginate \
            "repos/$REPOSITORY/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id, .workflow_id, .name, .status, .conclusion, .created_at, .path] | @tsv')"

          if [[ -z "$RUNS" ]]; then
            echo "No workflow runs found."
            exit 0
          fi

          # Keep the newest successful run per workflow, based on API order.
          KEEP_IDS="$(printf '%s\n' "$RUNS" |
            awk -F '\t' '$4 == "completed" && $5 == "success" {
              if (!($2 in kept)) {
                kept[$2] = $1
                print $1
              }
            }')"

          COUNT=0
          DELETED=0
          SKIPPED=0
          FAILED=0

          while IFS=$'\t' read -r RUN_ID WORKFLOW_ID WORKFLOW_NAME STATUS CONCLUSION CREATED_AT WORKFLOW_PATH; do
            [[ -z "$RUN_ID" ]] && continue
            COUNT=$((COUNT + 1))

            # Never delete any run of this cleanup workflow: GitHub can reject
            # deletion of the active workflow run, and retaining this history
            # is negligible compared with preserving the other workflows.
            if [[ "$WORKFLOW_PATH" == ".github/workflows/cleanup-artifacts.yml" || "$RUN_ID" == "$CURRENT_RUN_ID" ]]; then
              echo "SKIP cleanup workflow run: $RUN_ID ($CREATED_AT)"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            if printf '%s\n' "$KEEP_IDS" | grep -Fxq "$RUN_ID"; then
              echo "KEEP: $WORKFLOW_NAME — latest successful run $RUN_ID ($CREATED_AT)"
              continue
            fi

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "[DRY RUN] Would delete: $WORKFLOW_NAME — run $RUN_ID ($STATUS / ${CONCLUSION:-none}, $CREATED_AT)"
            else
              echo "Deleting: $WORKFLOW_NAME — run $RUN_ID"
              if gh run delete "$RUN_ID" --repo "$REPOSITORY"; then
                DELETED=$((DELETED + 1))
              else
                # A run may disappear between listing and deletion. Continue
                # so one inaccessible/stale run doesn't block all cleanup.
                echo "::warning::Could not delete run $RUN_ID; it may already be deleted or inaccessible. Continuing."
                FAILED=$((FAILED + 1))
              fi
            fi
          done <<< "$RUNS"

          echo "Runs examined: $COUNT"
          echo "Runs deleted: $DELETED"
          echo "Cleanup workflow runs skipped: $SKIPPED"
          echo "Deletion failures: $FAILED"
          echo "Successful runs retained: $(printf '%s\n' "$KEEP_IDS" | grep -c . || true)"
