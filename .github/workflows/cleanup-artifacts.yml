name: Cleanup Old Workflow Runs

on:
  workflow_dispatch:
    inputs:
      successful_runs_to_keep:
        description: "Number of successful runs to retain for each workflow"
        required: true
        default: "5"
        type: choice
        options:
          - "1"
          - "3"
          - "5"
          - "10"
      dry_run:
        description: "Preview deletions without deleting anything"
        required: true
        default: true
        type: boolean

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Keep Recent Successful Runs
    runs-on: ubuntu-latest

    steps:
      - name: Preview or delete workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
          SUCCESSFUL_RUNS_TO_KEEP: ${{ inputs.successful_runs_to_keep }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$SUCCESSFUL_RUNS_TO_KEEP" =~ ^[0-9]+$ ]] || (( SUCCESSFUL_RUNS_TO_KEEP < 1 )); then
            echo "::error::successful_runs_to_keep must be a positive integer."
            exit 1
          fi

          echo "Repository: $REPOSITORY"
          echo "Successful runs to keep per workflow: $SUCCESSFUL_RUNS_TO_KEEP"
          echo "Dry run: $DRY_RUN"
          echo "Current cleanup run: $CURRENT_RUN_ID"

          RUNS="$(gh api \
            --paginate \
            "repos/$REPOSITORY/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id, .workflow_id, .name, .status, .conclusion, .created_at, .path] | @tsv')"

          if [[ -z "$RUNS" ]]; then
            echo "No workflow runs found."
            exit 0
          fi

          # The API lists runs newest first. Keep the N newest successful
          # runs for each workflow; all other runs are eligible for deletion.
          KEEP_IDS="$(printf '%s\n' "$RUNS" |
            awk -F '\t' -v limit="$SUCCESSFUL_RUNS_TO_KEEP" '
              $4 == "completed" && $5 == "success" {
                if (kept[$2] < limit) {
                  kept[$2]++
                  print $1
                }
              }')"

          COUNT=0
          DELETED=0
          SKIPPED=0
          FAILED=0

          while IFS=$'\t' read -r RUN_ID WORKFLOW_ID WORKFLOW_NAME STATUS CONCLUSION CREATED_AT WORKFLOW_PATH; do
            [[ -z "$RUN_ID" ]] && continue
            COUNT=$((COUNT + 1))

            # Avoid self-deletion and retain cleanup workflow history.
            if [[ "$WORKFLOW_PATH" == ".github/workflows/cleanup-artifacts.yml" || "$RUN_ID" == "$CURRENT_RUN_ID" ]]; then
              echo "SKIP cleanup workflow run: $RUN_ID ($CREATED_AT)"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            if printf '%s\n' "$KEEP_IDS" | grep -Fxq "$RUN_ID"; then
              echo "KEEP: $WORKFLOW_NAME — successful run $RUN_ID ($CREATED_AT)"
              continue
            fi

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "[DRY RUN] Would delete: $WORKFLOW_NAME — run $RUN_ID ($STATUS / ${CONCLUSION:-none}, $CREATED_AT)"
            else
              echo "Deleting: $WORKFLOW_NAME — run $RUN_ID"
              if gh run delete "$RUN_ID" --repo "$REPOSITORY"; then
                DELETED=$((DELETED + 1))
              else
                echo "::warning::Could not delete run $RUN_ID; it may already be deleted or inaccessible. Continuing."
                FAILED=$((FAILED + 1))
              fi
            fi
          done <<< "$RUNS"

          echo "Runs examined: $COUNT"
          echo "Runs deleted: $DELETED"
          echo "Cleanup workflow runs skipped: $SKIPPED"
          echo "Deletion failures: $FAILED"
          echo "Successful runs retained per workflow: $SUCCESSFUL_RUNS_TO_KEEP"
