<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="format-detection" content="telephone=no,address=no,email=no,date=no,url=no">
  <title>Miles Manager</title>
</head>

<body style="margin:0; padding:0; background:#ffffff; font-family:Arial, Helvetica, sans-serif; color:#222222;">

  <table width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation">
    <tr>
      <td align="center" style="padding:40px 20px;">

        <table width="600" cellpadding="0" cellspacing="0" border="0" role="presentation"
               style="width:100%; max-width:600px;">

          <tr>
            <td align="center" style="padding-bottom:32px;">
              <img src="http://136.111.15.23/assets/logo-wide.png"
                   alt="Miles Manager"
                   width="600"
                   style="display:block; width:100%; max-width:600px; height:auto; border:0;">
            </td>
          </tr>

          <tr>
            <td align="center" style="padding-bottom:16px;">
              <h1 style="margin:0; font-size:32px; line-height:1.3; font-weight:600;">
                Your account is now active, {{FullName}}!
              </h1>
            </td>
          </tr>

          <tr>
            <td align="center" style="padding-bottom:16px; font-size:16px; line-height:1.6;">
              An administrator has approved your Miles Manager account.
            </td>
          </tr>

          <tr>
            <td align="center" style="padding-bottom:24px; font-size:16px; line-height:1.6;">
              You can now log in and start managing your airline programs,
              miles and rewards.
            </td>
          </tr>

          <tr>
            <td align="center" style="font-size:16px; line-height:1.6;">
              Thank you,<br>
              Miles Manager
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
